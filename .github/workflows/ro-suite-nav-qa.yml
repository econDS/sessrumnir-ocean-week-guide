name: Ocean RO Suite navigation QA
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ocean-nav-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  navigation-qa:
    if: github.head_ref == 'fix/archive-status-clarity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Prepare failure-safe evidence
        run: |
          mkdir -p qa-artifacts
          printf '%s\n' '{"status":"not-run","reason":"See setup logs if Chromium did not start"}' > qa-artifacts/report.json
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          mkdir -p "$RUNNER_TEMP/ocean-base"
          git archive e2d407699d5a8fc5a37b91ffec1071df9bf41471 docs | tar -x -C "$RUNNER_TEMP/ocean-base"
      - name: Source baseline and integration checks
        run: node --test tests/*.test.cjs 2>&1 | tee qa-artifacts/static-tests.log
      - name: Install pinned browser tooling
        id: browser-tools
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/ocean-nav-qa" --no-save --package-lock=false --ignore-scripts playwright@1.55.1 2>&1 | tee qa-artifacts/browser-install.log
          node "$RUNNER_TEMP/ocean-nav-qa/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee -a qa-artifacts/browser-install.log
      - name: Real browser baseline and regression QA
        if: always() && steps.browser-tools.outcome == 'success'
        env:
          NODE_PATH: ${{ runner.temp }}/ocean-nav-qa/node_modules
          QA_OUTPUT: ${{ github.workspace }}/qa-artifacts
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: e2d407699d5a8fc5a37b91ffec1071df9bf41471
          BASE_DOCS: ${{ runner.temp }}/ocean-base/docs
        run: |
          grep -q '<ro-suite-nav ' docs/index.html
          node tests/ro-suite-nav.browser.cjs 2>&1 | tee qa-artifacts/browser-tests.log
      - name: Upload logs, reports, and screenshots even after failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocean-nav-qa-${{ github.event.pull_request.head.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 90

  cross-repository-consistency:
    if: github.head_ref == 'chore/ro-suite-nav-1.3.0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Fetch exact reviewed candidates and install pinned QA-only browser
        run: |
          mkdir -p suite-artifacts "$RUNNER_TEMP/suite"
          git rev-parse HEAD > suite-artifacts/source-commit.txt
          node - <<'NODE'
          const heads=require('./qa/ro-suite-nav-1.3.0/suite-heads.json');
          const {execFileSync:run}=require('node:child_process');
          for(const [key,{repo,sha}] of Object.entries(heads)) {
            const cwd=process.env.RUNNER_TEMP+'/suite/'+key;
            run('git',['init',cwd]);
            run('git',['fetch','--depth','1','https://github.com/econDS/'+repo+'.git',sha],{cwd,stdio:'inherit'});
            run('git',['checkout','--detach','FETCH_HEAD'],{cwd,stdio:'inherit'});
          }
          NODE
          npm install --prefix "$RUNNER_TEMP/suite-qa" --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          node "$RUNNER_TEMP/suite-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real candidate cross-repository navigation matrix
        env:
          NODE_PATH: ${{ runner.temp }}/suite-qa/node_modules
          SUITE_ROOT: ${{ runner.temp }}/suite
          QA_OUTPUT: ${{ github.workspace }}/suite-artifacts
        run: set -o pipefail; node tests/suite130.browser.cjs 2>&1 | tee suite-artifacts/cross-repo.log
      - name: Upload final-head suite evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-repo-nav130-${{ github.event.pull_request.head.sha }}
          path: suite-artifacts/
          retention-days: 90
