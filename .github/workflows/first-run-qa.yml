name: Ocean first-run UX QA
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ocean-first-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  navigation-qa:
    if: github.head_ref == 'ux/first-run-ocean-guide' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Prepare failure-safe evidence
        run: |
          mkdir -p qa-artifacts
          printf '%s\n' '{"status":"not-run","reason":"See setup logs if Chromium did not start"}' > qa-artifacts/report.json
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          mkdir -p "$RUNNER_TEMP/ocean-base"
          git archive 01e356ade26cb4f80c70dc3e75882cca79aa30b9 docs | tar -x -C "$RUNNER_TEMP/ocean-base"
      - name: Source baseline and integration checks
        run: node --test tests/*.test.cjs 2>&1 | tee qa-artifacts/static-tests.log
      - name: Install pinned browser tooling
        id: browser-tools
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/ocean-nav-qa" --no-save --package-lock=false --ignore-scripts playwright@1.55.1 2>&1 | tee qa-artifacts/browser-install.log
          node "$RUNNER_TEMP/ocean-nav-qa/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee -a qa-artifacts/browser-install.log
      - name: Real browser baseline and regression QA
        if: always() && steps.browser-tools.outcome == 'success'
        env:
          NODE_PATH: ${{ runner.temp }}/ocean-nav-qa/node_modules
          QA_OUTPUT: ${{ github.workspace }}/qa-artifacts
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: 01e356ade26cb4f80c70dc3e75882cca79aa30b9
          BASE_DOCS: ${{ runner.temp }}/ocean-base/docs
        run: |
          grep -q '<ro-suite-nav ' docs/index.html
          node tests/ro-suite-nav.browser.cjs 2>&1 | tee qa-artifacts/browser-tests.log
          QA_OUTPUT="$GITHUB_WORKSPACE/qa-artifacts/first-run" node tests/first-run.browser.cjs 2>&1 | tee qa-artifacts/first-run.log
      - name: Upload logs, reports, and screenshots even after failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocean-first-run-${{ github.event.pull_request.head.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 90

  cross-suite-first-run:
    if: github.head_ref == 'ux/first-run-ocean-guide' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Fetch exact candidate heads without credentials
        run: |
          mkdir -p suite-artifacts "$RUNNER_TEMP/suite/sessrumnir-ocean-week-guide"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/suite/sessrumnir-ocean-week-guide"
          node - <<'NODE'
          const heads=require('./qa/first-run/suite-heads.json'),fs=require('node:fs'),{execFileSync:run}=require('node:child_process');
          for(const[repo,sha]of Object.entries(heads)){const cwd=process.env.RUNNER_TEMP+'/suite/'+repo;run('git',['init',cwd]);run('git',['fetch','--depth','1','https://github.com/econDS/'+repo+'.git',sha],{cwd,stdio:'inherit'});run('git',['checkout','--detach','FETCH_HEAD'],{cwd,stdio:'inherit'});}
          NODE
          npm install --prefix "$RUNNER_TEMP/suite-tools" --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          node "$RUNNER_TEMP/suite-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify cross-suite first-run consistency on all exact candidates
        env:
          NODE_PATH: ${{ runner.temp }}/suite-tools/node_modules
          SUITE_ROOT: ${{ runner.temp }}/suite
          SUITE_HEADS: ${{ github.workspace }}/qa/first-run/suite-heads.json
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          QA_OUTPUT: ${{ github.workspace }}/suite-artifacts
        run: set -o pipefail; node tests/suite-first-run.browser.cjs 2>&1 | tee suite-artifacts/cross-suite.log
      - name: Upload cross-suite evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-run-suite-${{ github.event.pull_request.head.sha }}
          path: suite-artifacts/
          retention-days: 30
